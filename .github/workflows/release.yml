name: Cross-platform release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Make scripts executable
        run: chmod +x scripts/package-linux.sh scripts/smoke-test.sh

      - name: Build and package
        run: ./scripts/package-linux.sh

      - name: Run offline smoke tests
        run: ./scripts/smoke-test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AeroGamecenter-Linux
          path: release/linux/*
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y
          }

      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: AeroGamecenter-Windows
          path: release/windows/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make scripts executable
        run: chmod +x scripts/package-macos.sh

      - name: Build and package
        run: ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AeroGamecenter-macOS
          path: release/macos/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail

          POM_VERSION="$(awk '/<version>/{line=$0; sub(/.*<version>/,"",line); sub(/<\/version>.*/,"",line); print line; exit}' pom.xml)"

          RELEASE_TAG="$GITHUB_REF_NAME"
          TAG_VERSION="${RELEASE_TAG#v}"

          if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
            echo "HATA: Git tag ($TAG_VERSION) ile pom.xml versiyonu ($POM_VERSION) aynı değil."
            exit 1
          fi

          mapfile -t INSTALLERS < <(
            find release-assets -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) \
            -print
          )

          if [[ "${#INSTALLERS[@]}" -ne 3 ]]; then
            echo "HATA: 3 kurulum dosyası bulunamadı."
            find release-assets -type f
            exit 1
          fi

          echo "Bulunan kurulum dosyaları:"
          printf '%s\n' "${INSTALLERS[@]}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t ASSETS < <(
            find release-assets -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) \
            -print
          )

          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --verify-tag \
            --generate-notes \
            --title "AeroGamecenter $GITHUB_REF_NAME"
